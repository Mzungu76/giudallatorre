</style></head><body>

<script>

// torre con personaggi dietro i merli (stessa geometria del prototipo): left,top della torre in px, fattore k
function towerBlock(ids,left,top,k,n){const TW=391/1.5*k,HT=2506/1.5*k;let out='';
 const spec=n===8?(()=>{const T8=[[70,116],[50,124],[30,132]],a=[];for(let i=0;i<8;i++){const t=[0,2,1,0,2,1,0,2][i];a.push([72+i*(228/7),T8[t][0],T8[t][1]])}return a})():[[80,70,140],[133,34,150],[186,70,140],[239,34,150],[292,70,140]].map(a=>a);
 const base=left+8/1.5*k; // x del bordo sinistro della torre (padding incluso) -> centro corona = left+TW/2
 const cx=left+TW/2;
 spec.slice(0,ids.length).forEach((a,i)=>{const x=cx+(a[0]-186)*k,feet=top+(a[1]-0)*k-(8/1.5)*k+ (0),h=a[2]*k;out+=`<img class="cut stk" src="${A(ids[i])}" style="position:absolute;height:${h}px;left:${x}px;top:${feet-h}px;transform:translateX(-50%);z-index:5">`});
 out+=`<img class="cut" src="${A('tower')}" style="position:absolute;left:${left}px;top:${top-8/1.5*k}px;width:${TW}px;height:${HT}px;z-index:6;max-width:none">`;return out}

${towerBlock(['p05-i01','p05-i02','p05-i03'].concat([]),56,330,1,3).replace(/(<img class="cut stk")/g,'$1')}
<div style="left:20px;right:20px;bottom:24px;display:flex;flex-direction:column;gap:12px;z-index:40"><div class="bt">Crea partita</div><div class="bt red">Entra con un codice</div><div class="bt pap" style="font-size:19px;padding:11px">Come si gioca</div></div>${FR}</div>`]};

<div class="h r" style="top:70px"><small>Prima di salire…</small>Crea la partita</div>

<div style="left:20px;right:20px;top:330px;display:flex;gap:10px;align-items:center"><div style="flex:1;height:3px;background:var(--navy);opacity:.4"></div><span style="font:400 20px 'Caveat Brush'">oppure</span><div style="flex:1;height:3px;background:var(--navy);opacity:.4"></div></div>

phones:[`<div class="s">${skyBg}${chips(0)}<div class="strip">★ SEI IL MEGAFONO ★</div>
<div style="left:206px;top:92px;width:160px;height:190px;background:url(${A('hands')}) 0 0/659px 339px no-repeat;transform:rotate(8deg);filter:drop-shadow(4px 5px 0 #13224a);z-index:21"></div>
