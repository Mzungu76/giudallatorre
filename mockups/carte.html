.bt{display:flex;align-items:center;justify-content:center;gap:8px;font:400 25px/1 Anton;text-transform:uppercase;letter-spacing:.02em;padding:15px 12px;border:3px solid var(--navy);box-shadow:5px 5px 0 var(--navy);color:var(--navy);background:var(--mus);text-align:center}
.bt.red{background:var(--red);color:#fff}.bt.pap{background:#fff7e0}.bt.dis{background:#c9c3b0;color:#8c8672;box-shadow:5px 5px 0 #7b7766}

.cut{display:block}.stk{filter:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(5px 6px 0 #13224a)}

.sw{width:56px;height:32px;border:3px solid var(--navy);background:#c9c3b0;position:relative;flex:none;border-radius:99px}.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--navy)}.sw.on{background:var(--mus)}.sw.on::after{left:auto;right:3px}
.cb{display:flex;gap:8px;justify-content:center}.cb b{width:50px;height:64px;background:#fff;border:3px solid var(--navy);box-shadow:3px 3px 0 var(--navy);display:grid;place-items:center;font:400 38px/1 Anton}.cb b.e{border-style:dashed;box-shadow:none;opacity:.6}
.pl{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--navy);box-shadow:3px 3px 0 var(--navy);padding:6px 10px;font:800 16px Nunito}.pl .tg{margin-left:auto;background:var(--mus);border:2px solid var(--navy);font:400 12px/1 Anton;padding:3px 7px;letter-spacing:.06em}.pl .x{margin-left:8px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;border:2px solid var(--navy);font-weight:800;font-size:13px}.pl.em{border-style:dashed;box-shadow:none;background:#fff7e0aa;opacity:.8;min-height:44px}
.bn{background:var(--red);color:#fff;border:3px solid var(--navy);box-shadow:5px 5px 0 var(--navy);padding:10px 14px;font:700 15px/1.25 Nunito}.bn small{display:block;font:400 12px/1 Anton;letter-spacing:.08em;text-transform:uppercase;opacity:.9;margin-bottom:3px}
.opt{background:#fff7e0;border:3px solid var(--navy);box-shadow:3px 3px 0 var(--navy);padding:8px 11px;font:800 13.5px/1.25 Nunito;position:relative}.opt.on{background:var(--mus);box-shadow:0 0 0 3px #fff,0 0 20px 6px #ffc72caa,4px 4px 0 var(--navy)}
.pod{display:flex;align-items:flex-end;gap:8px}.pod div{flex:1;border:3px solid var(--navy);box-shadow:4px 4px 0 var(--navy);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:3px;color:#fff;font:400 18px/1 Anton}
.qr{background:#fff;border:3px solid var(--navy);padding:6px}.qr svg{display:block;width:100%;height:100%}
.hands{left:-40px;width:480px;z-index:5}

.phw.sm{width:auto}
.vp{position:relative;overflow:hidden;border:6px solid #07070b;border-radius:26px;box-shadow:0 18px 40px #000a;background:var(--paper);color:var(--navy);flex:none}

.sizes{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end}
.lbl2{font:800 12px Nunito;opacity:.7;text-align:center;margin-top:6px}
.tok{display:inline-block;filter:drop-shadow(3px 4px 0 #13224a)}
.tok svg{display:block}
.beat{width:390px;flex:none}
.beat .ph{margin-bottom:8px}

.title-card{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:0 24px;z-index:30}
.big{font:400 58px/.88 Anton;color:#fff;text-shadow:4px 4px 0 var(--red),8px 8px 0 var(--navy);text-transform:uppercase}
.sub{font:400 26px 'Caveat Brush';color:#fff;text-shadow:2px 2px 0 var(--navy)}
.ring{width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--mus) 0 70%,#fff7e0 70%);border:4px solid var(--navy);display:grid;place-items:center;box-shadow:3px 3px 0 var(--navy)}
.ring b{width:62px;height:62px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font:400 34px Anton}
.bar{height:20px;border:2px solid var(--navy);background:#fff;position:relative;flex:1}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--teal)}
.delta{font:400 15px Anton;padding:2px 6px;border:2px solid var(--navy);background:var(--mus)}
.delta.up{background:#9be28f}.delta.dn{background:#ff9d93}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:30px;height:8px;border:2px solid var(--navy);background:#fff7e0}.steps i.on{background:var(--mus)}.steps i.dn{background:var(--navy)}
.ta{background:#fff;border:3px solid var(--navy);box-shadow:4px 4px 0 var(--navy);padding:12px;font:800 19px/1.25 Nunito;min-height:112px}
.pre{display:inline-block;background:var(--red);color:#fff;font:400 15px Anton;padding:4px 9px;border:3px solid var(--navy);box-shadow:3px 3px 0 var(--navy);letter-spacing:.04em;text-transform:uppercase}
.caret{display:inline-block;width:2px;height:22px;background:var(--navy);vertical-align:-4px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.big-opt{display:flex;align-items:center;gap:12px;background:#fff7e0;border:4px solid var(--navy);box-shadow:5px 5px 0 var(--navy);padding:14px;text-align:left}
.big-opt b{font:400 22px/1 Anton;text-transform:uppercase;display:block}.big-opt small{font:800 12px/1.3 Nunito;opacity:.8;display:block;margin-top:3px}
.big-opt.on{background:var(--mus);outline:4px solid #fff}
.ic{font-size:30px;flex:none}
.bottom{position:absolute;left:16px;right:16px;bottom:24px;z-index:30;display:flex;flex-direction:column;gap:8px}.bottom.two{flex-direction:row}.bottom.two .bt{flex:1}.hint-bottom{text-align:center;font:400 20px 'Caveat Brush';color:#fff;text-shadow:2px 2px 0 var(--navy)}
.note2{font:800 12px/1.35 Nunito;background:#fff;border:2px solid var(--navy);padding:6px 9px}
</style><style>
.cd{position:absolute;border-radius:8px;background:center/cover;border:4px solid #fff;box-shadow:3px 4px 0 #13224a;transform-origin:50% 100%}
.cd i{position:absolute;left:-9px;top:-9px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#e0a52c 70%);border:3px solid #6e4310;color:#4a2a06;font:400 13px/18px Anton;text-align:center;font-style:normal;box-shadow:0 2px 0 #0006}
.cd.sel{outline:4px solid var(--mus);box-shadow:0 0 18px 6px #ffc72caa,3px 4px 0 #13224a}
.vt{position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid #fff;box-shadow:2px 2px 0 #13224a;display:grid;place-items:center;font:400 10px Anton;color:#fff;z-index:30}

</style></head><body><header class="g"><h1>Giù dalla Torre — Torre a carte</h1><p>Proposta: i personaggi tornano a essere carte (le illustrazioni originali, senza scontorni). Sulla Torre spuntano a ventaglio dal parapetto; toccandone una si ingrandisce. Bozza da approvare.</p></header>
<nav class="g"></nav><main class="g" id="main"></main>
<script>
window.IMGS=window.IMGS||(()=>{const o={};for(let p=1;p<=6;p++)for(let i=1;i<=9;i++){const id='p0'+p+'-i0'+i;o[id]='../public/cards/'+id+'.webp'};o.tower='../public/scene/tower_pop.webp';return o})();
const A=id=>window.IMGS[id];
const PLN=[['Marta','#e5384b'],['Luca','#2f7be0'],['Giulia','#f4c20d'],['Omar','#3aa655'],['Elena','#8a5a3b'],['Paolo','#8e44c8'],['Sara','#ee7bb0'],['Tommi','#222']];
const dc=(c,k='')=>`<i class="dc ${k}" style="background:${c}"></i>`;
const chips=(w=1)=>`<div class="chips"><span class="chip">${dc(PLN[w][1])} ${PLN[w][0]}</span><span class="chip">📣 Marta</span><span class="chip">Turno 3/10</span></div>`;
const skyBg=`<div class="sky" style="inset:0"></div><div class="skyg" style="inset:0"></div><div class="dots" style="inset:0"></div>`;
const FR=`<div class="fr"></div><div class="grain"></div>`;
const IDS=['p05-i01','p05-i02','p05-i03','p05-i04','p05-i05','p05-i06','p05-i07','p05-i09'];
const lui=(back)=>`<svg width="30" height="30" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="${back?'#13224a':'#ffc72c'}" stroke="${back?'#fff7e0':'#13224a'}" stroke-width="6"/>${back?'<text x="50" y="66" text-anchor="middle" font-family="Anton" font-size="52" fill="#ffc72c">?</text>':'<text x="50" y="46" text-anchor="middle" font-family="Anton" font-size="24" fill="#13224a">CADE</text><text x="50" y="68" text-anchor="middle" font-family="Anton" font-size="24" fill="#e8362b">LUI!</text>'}</svg>`;
/* ventaglio: n carte dietro il parapetto. L = left torre, T = top torre */
function fan(n,L,T,opt={}){
  const k=1,TW=391/1.5,cx=L+TW/2,m=(n-1)/2;
  const w=n<=5?88:78,h=Math.round(w*1.5),step=n<=5?58:(n<=6?44:35),rot=n<=5?6:4,arc=n<=5?5:3;
  let out='';
  const order=[...Array(n).keys()];
  order.forEach(i=>{const d=i-m,x=cx+d*step-w/2,y=T+64-h*(n<=5?.80:.80)+d*d*arc*.5-(opt.sel===i?22:0);
    out+=`<div class="cd ${opt.sel===i?'sel':''}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background-image:url(${A(IDS[i])});transform:rotate(${d*rot}deg);z-index:${opt.sel===i?20:3+i}"><i>${i+1}</i></div>`});
  (opt.votes||[]).forEach(([p,c,j])=>{const d=p-1-m;out+=`<div class="vt" style="left:${cx+d*step-10+(j?9:-9)}px;top:${T+50+j*14}px;background:${c}">${p}</div>`});
  if(opt.lui!=null){const d=opt.lui-m;out+=`<div style="position:absolute;left:${cx+d*step-15}px;top:${T+46}px;z-index:31;filter:drop-shadow(2px 3px 0 #13224a)">${lui(opt.luiBack)}</div>`}
  out+=`<img src="${A('tower')}" style="position:absolute;left:${L-8/1.5}px;top:${T-8/1.5}px;width:${TW+16/1.5}px;height:auto;z-index:25;max-width:none">`;
  return out}
const S={};
S.v5={t:'1 · Torre con 5 giocatori',n:'Le carte spuntano dal parapetto a ventaglio: si vede la parte alta con volto e busto, il resto sta dietro i merli. Ogni carta ha il suo numero. La Torre è la stessa del gioco.',
 phones:[`<div class="s">${skyBg}${chips(1)}<div class="strip">★ VOTA IN SEGRETO ★</div><div class="h" style="top:94px;font-size:36px"><small>Oggi sale sulla torre…</small>chi manda vocali da nove minuti</div>${fan(5,56,360,{lui:2,luiBack:true})}<div class="bottom"><div class="hint-bottom">tocca una carta per vederla bene</div><div class="bt">Scegli chi cade</div></div>${FR}</div>`,
 `<div class="s">${skyBg}${chips(1)}<div class="strip">★ LO SPOGLIO ★</div><div class="h" style="top:94px;font-size:36px"><small>Voto di Luca…</small>n. 2!</div>${fan(5,56,360,{votes:[[1,'#e5384b',0],[2,'#2f7be0',0],[2,'#f4c20d',1],[3,'#3aa655',0]],lui:2})}${FR}</div>`]};
S.v8={t:'2 · Torre con 8 giocatori',n:'A 8 il ventaglio si stringe: ogni carta mostra circa il 60% (faccia e busto). A sinistra il ventaglio: scenografico ma con carte piccole e sovrapposte (si leggono i volti). A destra due file da 4: più leggibili, meno scenografiche. Dal nostro confronto consiglio le due file a 6-8 giocatori e il ventaglio fino a 5.',
 phones:[`<div class="s">${skyBg}${chips(1)}<div class="strip">★ VOTA IN SEGRETO ★</div><div class="h" style="top:94px;font-size:34px"><small>Oggi sale sulla torre…</small>chi manda vocali da nove minuti</div>${fan(8,56,420,{lui:3,luiBack:true})}<div class="bottom"><div class="hint-bottom">tocca una carta per vederla bene</div><div class="bt">Scegli chi cade</div></div>${FR}</div>`,
 `<div class="s">${skyBg}${chips(1)}<div class="strip">★ VOTA IN SEGRETO ★</div><div class="h" style="top:94px;font-size:34px"><small>Oggi sale sulla torre…</small>chi manda vocali da nove minuti</div>${(()=>{const L=56,T=470,TW=391/1.5,cx=L+TW/2;let o='';const w=70,h=105;[0,1,2,3].forEach(i=>{o+=`<div class="cd" style="left:${cx+(i-1.5)*68-w/2}px;top:${T+40-h*.8-98}px;width:${w}px;height:${h}px;background-image:url(${A(IDS[i])});z-index:3"><i>${i+1}</i></div>`});[4,5,6,7].forEach((j,q)=>{o+=`<div class="cd" style="left:${cx+(q-1.5)*68-w/2}px;top:${T+40-h*.8}px;width:${w}px;height:${h}px;background-image:url(${A(IDS[j])});z-index:4"><i>${j+1}</i></div>`});return o+`<img src="${A('tower')}" style="position:absolute;left:${L-5}px;top:${T-5}px;width:${TW+11}px;z-index:25;max-width:none">`})()}<div class="bottom"><div class="hint-bottom">tocca una carta per vederla bene</div><div class="bt">Scegli chi cade</div></div>${FR}</div>`]};
