<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wow C — All'americana</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--wall:#10303f;--wall2:#071820;--cream:#fff1cf;--orange:#ff8a2a;--pink:#ff3d8b;--cyan:#31e1f7;--gold:#ffd24a}
*{box-sizing:border-box;margin:0}
body{background:#050a10;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Nunito,sans-serif}
.phone{width:390px;height:844px;border-radius:44px;border:9px solid #020406;position:relative;overflow:hidden;background:linear-gradient(180deg,#06121a 0,var(--wall) 55%,#0a2430 100%);box-shadow:0 30px 80px #000c;color:var(--cream)}
.chart{position:absolute;left:0;right:0;top:150px;height:430px;background:repeating-linear-gradient(0deg,transparent 0 23px,#fff1cf26 23px 24px);}
.chart::before,.chart::after{content:"";position:absolute;top:0;bottom:0;width:30px;background:repeating-linear-gradient(0deg,transparent 0 23px,#fff1cf88 23px 25px) right/16px 100% no-repeat,repeating-linear-gradient(0deg,transparent 0 11px,#fff1cf55 11px 12px) right/9px 100% no-repeat}
.chart::before{left:0}.chart::after{right:0;transform:scaleX(-1)}
.chart i{position:absolute;font:700 10px Nunito;color:#fff1cfaa;left:34px}
.chart i.r{left:auto;right:34px}
/* beams */
.beam{position:absolute;top:-30px;width:210px;height:640px;clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);mix-blend-mode:screen;filter:blur(2px)}
.b1{left:-60px;background:linear-gradient(180deg,#ff8a2acc,#ff8a2a00 92%);transform:rotate(-10deg)}
.b2{right:-60px;background:linear-gradient(180deg,#31e1f7bb,#31e1f700 92%);transform:rotate(10deg)}
.b3{left:90px;width:230px;background:linear-gradient(180deg,#fff7c4aa,#fff7c400 90%);z-index:1}
.floor{position:absolute;left:-40px;right:-40px;bottom:0;height:300px;background:
 linear-gradient(180deg,#0b2733 0,#050e14 70%);transform-origin:top;}
.grid{position:absolute;left:-40px;right:-40px;top:560px;height:290px;background:
 repeating-linear-gradient(90deg,#fff1cf22 0 1px,transparent 1px 42px);transform:perspective(220px) rotateX(58deg);transform-origin:top;opacity:.7}
.pool{position:absolute;left:55px;top:545px;width:280px;height:70px;border-radius:50%;background:radial-gradient(ellipse,#fff7c4cc,#fff7c400 70%);z-index:3}
/* coverflow */
.stage{position:absolute;left:0;right:0;top:180px;height:380px;perspective:800px;z-index:4}
.c{position:absolute;top:50px;left:50%;width:170px;height:255px;margin-left:-85px;border-radius:14px;background:center/cover;border:5px solid var(--cream);box-shadow:0 12px 30px #000a}
.c .pl{position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);background:#0a0a0c;color:var(--cream);border:2px solid var(--cream);font:400 15px/1 Bungee;padding:5px 12px;letter-spacing:.06em;white-space:nowrap}
.c.mid{z-index:5;transform:translateZ(120px) scale(1.12);box-shadow:0 0 0 3px var(--gold),0 0 60px 8px #ffd24a99,0 18px 40px #000b;border-color:#fff}
.c.l1{transform:translateX(-132px) rotateY(34deg) scale(.82);filter:brightness(.55) saturate(.9)}
.c.r1{transform:translateX(132px) rotateY(-34deg) scale(.82);filter:brightness(.55) saturate(.9)}
.c.l2{transform:translateX(-215px) rotateY(48deg) scale(.62);filter:brightness(.32)}
.c.r2{transform:translateX(215px) rotateY(-48deg) scale(.62);filter:brightness(.32)}
.refl{position:absolute;left:50%;top:455px;width:170px;height:100px;margin-left:-85px;border-radius:14px;background:url(../../public/cards/p05-i02.webp) center bottom/cover;transform:scaleY(-1);opacity:.28;-webkit-mask:linear-gradient(0deg,#0000 0,#000 100%);mask:linear-gradient(0deg,#000 0,#0000 100%);filter:blur(1.5px)}
.reticle{position:absolute;left:50%;top:272px;width:230px;height:300px;margin-left:-115px;z-index:6;pointer-events:none}
.reticle b{position:absolute;width:26px;height:26px;border:4px solid var(--gold)}
.reticle b:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.reticle b:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.reticle b:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.reticle b:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
/* neon */
.sign{position:absolute;left:14px;right:14px;top:62px;text-align:center;z-index:8}
.sign small{display:block;font:400 15px/1 Bungee;color:var(--pink);text-shadow:0 0 6px var(--pink),0 0 18px var(--pink);letter-spacing:.1em;margin-bottom:6px}
.sign b{display:block;font:400 23px/1.12 Bungee;color:#fff;text-shadow:0 0 4px #fff,0 0 14px var(--cyan),0 0 34px var(--cyan);letter-spacing:.01em}
.lights{position:absolute;left:10px;right:10px;top:50px;height:10px;background:radial-gradient(circle,#ffd24a 0 3.5px,transparent 4.5px) 0 0/22px 10px;filter:drop-shadow(0 0 4px #ffd24a);z-index:9}
.top{position:absolute;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;z-index:12;font:800 12px Nunito}
.top span{background:#ffffff18;border:1px solid #ffffff44;border-radius:99px;padding:5px 10px;display:flex;gap:6px;align-items:center}
.top i{width:11px;height:11px;border-radius:50%;border:2px solid #fff}
.tok{position:absolute;right:-16px;top:-16px;width:42px;height:42px;border-radius:50%;background:#2f7be0;border:4px solid #fff;color:#fff;font:400 18px/34px Bungee;text-align:center;box-shadow:0 0 18px #2f7be0}
.strip{position:absolute;left:0;right:0;top:618px;display:flex;justify-content:center;gap:10px;z-index:8}
.th{width:44px;height:66px;border-radius:7px;background:center/cover;border:2px solid #fff1cf88;position:relative;filter:brightness(.6)}
.th.on{filter:none;border-color:var(--gold);transform:translateY(-6px);box-shadow:0 0 14px #ffd24a}
.th s{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);background:#0a0a0c;color:#fff1cf;font:400 9px/1 Bungee;padding:2px 5px;text-decoration:none}
.cta{position:absolute;left:18px;right:18px;bottom:24px;z-index:10;border:0;border-radius:20px;height:84px;background:linear-gradient(#ff9a3a,#ff5d1f);color:#fff;font:400 24px/1 Bungee;box-shadow:0 0 0 4px #0a0a0c,0 0 0 7px var(--gold),0 0 40px #ff8a2a88;text-shadow:0 3px 0 #a73a0a;letter-spacing:.02em}
.cta small{display:block;font:800 12px Nunito;margin-top:6px;text-shadow:none;opacity:.95}
.cta::before,.cta::after{content:"";position:absolute;top:8px;bottom:8px;width:8px;background:radial-gradient(circle,#fff7c4 0 3px,transparent 4px) 0 0/8px 16px}
.cta::before{left:8px}.cta::after{right:8px}
</style></head><body>
<div class="phone">
 <div class="chart"><i style="top:0">2,00</i><i class="r" style="top:0">2,00</i><i style="top:96px">1,80</i><i class="r" style="top:96px">1,80</i><i style="top:192px">1,60</i><i class="r" style="top:192px">1,60</i><i style="top:288px">1,40</i><i class="r" style="top:288px">1,40</i></div>
 <div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div>
 <div class="grid"></div><div class="pool"></div>
 <div class="lights"></div>
 <div class="top"><span><i style="background:#2f7be0"></i>Luca</span><span>📣 Marta</span><span>Turno 3/10</span></div>
 <div class="sign"><small>★ Marta, il Megafono ★</small><b>Oggi sale sulla torre chi manda vocali da nove minuti.</b></div>
 <div class="stage">
  <div class="c l2" style="background-image:url(../../public/cards/p05-i01.webp)"><div class="pl">N° 1</div></div>
  <div class="c r2" style="background-image:url(../../public/cards/p05-i05.webp)"><div class="pl">N° 5</div></div>
  <div class="c l1" style="background-image:url(../../public/cards/p05-i01.webp)"><div class="pl">N° 1</div></div>
  <div class="c r1" style="background-image:url(../../public/cards/p05-i03.webp)"><div class="pl">N° 3</div></div>
  <div class="c mid" style="background-image:url(../../public/cards/p05-i02.webp)"><div class="tok">L</div><div class="pl" style="border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px #ffd24a">N° 2</div></div>
 </div>
 <div class="refl"></div>
 <div class="reticle"><b></b><b></b><b></b><b></b></div>
 <div class="strip">
  <div class="th" style="background-image:url(../../public/cards/p05-i01.webp)"><s>1</s></div>
  <div class="th on" style="background-image:url(../../public/cards/p05-i02.webp)"><s>2</s></div>
  <div class="th" style="background-image:url(../../public/cards/p05-i03.webp)"><s>3</s></div>
  <div class="th" style="background-image:url(../../public/cards/p05-i04.webp)"><s>4</s></div>
  <div class="th" style="background-image:url(../../public/cards/p05-i05.webp)"><s>5</s></div>
 </div>
 <button class="cta">È stato lui, il n. 2!<small>Voto segreto · 2 su 5 hanno già votato</small></button>
</div></body></html>
