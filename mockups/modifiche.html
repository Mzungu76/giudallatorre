<style>

.bt.red{background:var(--red);color:#fff}.bt.pap{background:#fff7e0}.bt.dis{background:#c9c3b0;color:#8c8672;box-shadow:5px 5px 0 #7b7766}

.pp{background:var(--paper);border:4px solid var(--navy);box-shadow:6px 7px 0 var(--navy);padding:12px 14px}
.tape{position:absolute;left:50%;top:-12px;width:60px;height:20px;margin-left:-30px;background:#ffc72ccc;transform:rotate(3deg)}
.cut{display:block}.stk{filter:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(5px 6px 0 #13224a)}
.card{width:104px;height:156px;border-radius:11px;background:center/cover;border:6px solid #fff;box-shadow:5px 6px 0 var(--navy)}
.card.sel{box-shadow:0 0 0 4px var(--mus),0 0 26px 10px #ffc72caa,6px 8px 0 var(--navy)}
.sp{color:#fff;font-size:20px}
.seg{display:flex;gap:10px}.seg .bt{flex:1;font-size:19px;padding:12px 6px}
.sw{width:56px;height:32px;border:3px solid var(--navy);background:#c9c3b0;position:relative;flex:none;border-radius:99px}.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--navy)}.sw.on{background:var(--mus)}.sw.on::after{left:auto;right:3px}
.cb{display:flex;gap:8px;justify-content:center}.cb b{width:50px;height:64px;background:#fff;border:3px solid var(--navy);box-shadow:3px 3px 0 var(--navy);display:grid;place-items:center;font:400 38px/1 Anton}.cb b.e{border-style:dashed;box-shadow:none;opacity:.6}
.pl{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--navy);box-shadow:3px 3px 0 var(--navy);padding:6px 10px;font:800 16px Nunito}.pl .tg{margin-left:auto;background:var(--mus);border:2px solid var(--navy);font:400 12px/1 Anton;padding:3px 7px;letter-spacing:.06em}.pl .x{margin-left:8px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;border:2px solid var(--navy);font-weight:800;font-size:13px}.pl.em{border-style:dashed;box-shadow:none;background:#fff7e0aa;opacity:.8;min-height:44px}
.bn{background:var(--red);color:#fff;border:3px solid var(--navy);box-shadow:5px 5px 0 var(--navy);padding:10px 14px;font:700 15px/1.25 Nunito}.bn small{display:block;font:400 12px/1 Anton;letter-spacing:.08em;text-transform:uppercase;opacity:.9;margin-bottom:3px}
.opt{background:#fff7e0;border:3px solid var(--navy);box-shadow:3px 3px 0 var(--navy);padding:8px 11px;font:800 13.5px/1.25 Nunito;position:relative}.opt.on{background:var(--mus);box-shadow:0 0 0 3px #fff,0 0 20px 6px #ffc72caa,4px 4px 0 var(--navy)}
.pod{display:flex;align-items:flex-end;gap:8px}.pod div{flex:1;border:3px solid var(--navy);box-shadow:4px 4px 0 var(--navy);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:3px;color:#fff;font:400 18px/1 Anton}
.qr{background:#fff;border:3px solid var(--navy);padding:6px}.qr svg{display:block;width:100%;height:100%}

.phw.sm{width:auto}
.vp{position:relative;overflow:hidden;border:6px solid #07070b;border-radius:26px;box-shadow:0 18px 40px #000a;background:var(--paper);color:var(--navy);flex:none}

.sizes{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end}
.lbl2{font:800 12px Nunito;opacity:.7;text-align:center;margin-top:6px}
.tok{display:inline-block;filter:drop-shadow(3px 4px 0 #13224a)}
.tok svg{display:block}
.beat{width:390px;flex:none}
.beat .ph{margin-bottom:8px}

.title-card{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:0 24px;z-index:30}
.big{font:400 58px/.88 Anton;color:#fff;text-shadow:4px 4px 0 var(--red),8px 8px 0 var(--navy);text-transform:uppercase}
.sub{font:400 26px 'Caveat Brush';color:#fff;text-shadow:2px 2px 0 var(--navy)}

.ring b{width:62px;height:62px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font:400 34px Anton}

.delta.up{background:#9be28f}.delta.dn{background:#ff9d93}

.steps i{width:30px;height:8px;border:2px solid var(--navy);background:#fff7e0}.steps i.on{background:var(--mus)}.steps i.dn{background:var(--navy)}
.ta{background:#fff;border:3px solid var(--navy);box-shadow:4px 4px 0 var(--navy);padding:12px;font:800 19px/1.25 Nunito;min-height:112px}
.pre{display:inline-block;background:var(--red);color:#fff;font:400 15px Anton;padding:4px 9px;border:3px solid var(--navy);box-shadow:3px 3px 0 var(--navy);letter-spacing:.04em;text-transform:uppercase}
.caret{display:inline-block;width:2px;height:22px;background:var(--navy);vertical-align:-4px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.big-opt{display:flex;align-items:center;gap:12px;background:#fff7e0;border:4px solid var(--navy);box-shadow:5px 5px 0 var(--navy);padding:14px;text-align:left}
.big-opt b{font:400 22px/1 Anton;text-transform:uppercase;display:block}.big-opt small{font:800 12px/1.3 Nunito;opacity:.8;display:block;margin-top:3px}
.big-opt.on{background:var(--mus);outline:4px solid #fff}
.ic{font-size:30px;flex:none}
.bottom{position:absolute;left:16px;right:16px;bottom:24px;z-index:30;display:flex;flex-direction:column;gap:8px}.bottom.two{flex-direction:row}.bottom.two .bt{flex:1}.hint-bottom{text-align:center;font:400 20px 'Caveat Brush';color:#fff;text-shadow:2px 2px 0 var(--navy)}
.note2{font:800 12px/1.35 Nunito;background:#fff;border:2px solid var(--navy);padding:6px 9px}
</style></head><body><header class="g"><h1>Giù dalla Torre — Mockup delle modifiche</h1><p>Proposte grafiche per le richieste dopo la prova sul telefono: schermo adattivo, intermezzi tra le fasi, classifica a fine round, gettone “Lui!” e frase personale del Megafono. Sono bozze da approvare: nulla è ancora implementato nel gioco.</p></header>

<script>
window.IMGS=window.IMGS||(()=>{const o={};['p05-i01','p05-i02','p05-i03','p05-i04','p05-i05','p05-i06','p05-i07','p05-i09'].forEach(i=>o[i]='../public/cutouts/'+i+'.webp');o.tower='../public/scene/tower_pop.webp';o.hands='../public/scene/hands_cut.webp';return o})();
const A=id=>window.IMGS[id];
const PLN=[['Marta','#e5384b'],['Luca','#2f7be0'],['Giulia','#f4c20d'],['Omar','#3aa655'],['Elena','#8a5a3b'],['Paolo','#8e44c8'],['Sara','#ee7bb0'],['Tommi','#222']];
const dc=(c,k='')=>`<i class="dc ${k}" style="background:${c}"></i>`;
const spk=(x,y,c='#fff')=>`<div class="sp" style="left:${x}px;top:${y}px"><svg width="26" height="26" viewBox="-13 -13 26 26"><path d="M0 -12Q2 -2 12 0Q2 2 0 12Q-2 2 -12 0Q-2 -2 0 -12Z" fill="${c}" stroke="#13224a" stroke-width="1.6"/></svg></div>`;
const chips=(who=1)=>`<div class="chips"><span class="chip">${dc(PLN[who][1])} ${PLN[who][0]}</span><span class="chip">📣 Marta</span><span class="chip">Turno 3/10</span></div>`;
const skyBg=`<div class="sky" style="inset:0"></div><div class="skyg" style="inset:0"></div><div class="dots" style="inset:0"></div>`;
const papBg=`<div class="pap" style="inset:0"></div><div class="hr" style="inset:0"></div><div class="ht" style="inset:0"></div>`;
const FR=`<div class="fr"></div><div class="grain"></div>`;
const I8=['p05-i01','p05-i02','p05-i03','p05-i04','p05-i05','p05-i06','p05-i07','p05-i09'];
function towerBlock(ids,left,top,k,n,opt={}){const TW=391/1.5*k,HT=2506/1.5*k;let out='';
 const spec=n>=6?[...Array(n).keys()].map(i=>{const m=(n-1)/2,d=Math.abs(i-m),q=7/(n-1);return [186+(i-m)*(175/(n-1)),86+d*5*q,150-d*6*q,(i-m)*(35/(n-1))]}):[[80,70,140,0],[133,34,150,0],[186,70,140,0],[239,34,150,0],[292,70,140,0]].slice(0,n).map((a,i)=>a);
 const cx=left+TW/2;
 spec.forEach((a,i)=>{const x=cx+(a[0]-186)*k,feet=top+a[1]*k-(8/1.5)*k,h=a[2]*k;out+=`<img class="cut stk" src="${A(ids[i])}" style="position:absolute;height:${h}px;left:${x}px;top:${feet-h}px;transform:translateX(-50%) rotate(${a[3]||0}deg);transform-origin:50% 100%;z-index:5;${opt.dim&&opt.dim.includes(i)?'filter:grayscale(1) brightness(.6)':''}">`});
 out+=`<img class="cut" src="${A('tower')}" style="position:absolute;left:${left}px;top:${top-8/1.5*k}px;width:${TW}px;height:${HT}px;z-index:6;max-width:none">`;return out}
/* gettone Lui! come nel regolamento: tondo giallo, punti nel cerchietto bianco */
function lui(kind,size=96,back=false){
 const id='a'+Math.random().toString(36).slice(2,7);
 if(back)return `<span class="tok" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#13224a" stroke="#fff7e0" stroke-width="4"/><circle cx="50" cy="50" r="37" fill="none" stroke="#ffc72c" stroke-width="2" stroke-dasharray="4 4"/><text x="50" y="64" text-anchor="middle" font-family="Anton" font-size="46" fill="#ffc72c">?</text></svg></span>`;
 const cade=kind==='CADE',pts=cade?4:1;
 return `<span class="tok" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#ffc72c" stroke="#13224a" stroke-width="5"/><circle cx="50" cy="50" r="38" fill="none" stroke="#13224a" stroke-width="1.6" stroke-dasharray="3 3" opacity=".6"/>
 ${cade?`<text x="50" y="40" text-anchor="middle" font-family="Anton" font-size="23" fill="#13224a" letter-spacing=".5">CADE</text><text x="50" y="62" text-anchor="middle" font-family="Anton" font-size="23" fill="#e8362b">LUI!</text>`:`<text x="50" y="31" text-anchor="middle" font-family="Anton" font-size="17" fill="#13224a">NON</text><text x="50" y="49" text-anchor="middle" font-family="Anton" font-size="17" fill="#13224a">CADE</text><text x="50" y="66" text-anchor="middle" font-family="Anton" font-size="17" fill="#e8362b">LUI!</text>`}
 <circle cx="50" cy="80" r="13" fill="#fff" stroke="#13224a" stroke-width="3"/><text x="50" y="86.5" text-anchor="middle" font-family="Anton" font-size="19" fill="#13224a">${pts}</text></svg></span>`}
const S={};
/* ---------- A. schermo adattivo ---------- */
function adaptive(w,h,label){
 const land=w>h*1.15, k=Math.max(.55,Math.min(1.25,land?(h-70)/430:(h-330)/380)), sc=Math.min(1.2,w/390);
 const TWk=k, tw=391/1.5*TWk;
 const tower=`<div style="position:relative;width:${tw}px;height:${Math.round(330*TWk)}px;flex:none;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 80%,transparent);mask-image:linear-gradient(180deg,#000 80%,transparent)">${towerBlock(['p05-i01','p05-i02','p05-i03'],0,150*TWk,TWk,3).replace(/left:([\d.-]+)px;top:/g,(m,a)=>`left:${a}px;top:`)}</div>`;
 const logo=`<div style="text-align:center;line-height:.85;transform:scale(${Math.min(1.15,sc)});transform-origin:center top"><div style="font:400 ${44}px/.9 Anton;color:#fff;text-shadow:3px 3px 0 var(--red),5px 5px 0 var(--navy);transform:rotate(-4deg);display:inline-block;margin-right:70px">GIÙ</div><div style="font:400 36px/.9 Anton;color:var(--mus);text-shadow:3px 3px 0 var(--navy);transform:rotate(3deg);display:inline-block;margin-left:-60px">DALLA</div><div style="font:400 84px/.82 Anton;color:#fff;text-shadow:4px 4px 0 var(--red),8px 8px 0 var(--navy);-webkit-text-stroke:3px var(--navy);paint-order:stroke fill">TORRE!</div></div>`;
 const btns=`<div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px"><div class="bt" style="padding:12px;font-size:22px">Crea partita</div><div class="bt red" style="padding:12px;font-size:22px">Entra con un codice</div><div class="bt pap" style="padding:9px;font-size:17px">Come si gioca</div></div>`;
 const inner=land?`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:space-around;padding:0 4%">${'<div style="display:flex;flex-direction:column;gap:22px;align-items:center;width:42%">'+logo+btns+'</div>'}<div style="position:relative;height:${330*TWk+20}px;display:flex;align-items:flex-start">${tower}</div></div>`
 :`<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:${Math.round(h*.04)}px 16px ${Math.round(h*.03)}px"><div style="height:${Math.round(150*Math.min(1.1,sc))}px">${logo}</div><div style="flex:1;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;min-height:0">${tower}</div>${btns}</div>`;
 return `<div class="phw sm"><div class="vp" style="width:${w}px;height:${h}px"><div class="s">${skyBg}${inner}</div></div><div class="lbl2">${label}</div></div>`}
S.adatt={t:'1 · Schermo adattivo',n:'Oggi il gioco è un “palco” 372×826 ridimensionato per stare nella finestra: sui telefoni più corti resta rimpicciolito con bande scure ai lati (come nella tua foto). Proposta: la larghezza riempie sempre lo schermo e l’altezza è elastica. Il logo e i pulsanti restano ai bordi, la torre occupa lo spazio che resta e si ingrandisce o rimpicciolisce. Su tablet e PC in orizzontale l’impaginazione passa a due colonne. Qui sotto la schermata Home in sei formati reali (le dimensioni sono in pixel CSS).',
 raw:`<div class="sizes">${adaptive(320,568,'piccolo 320×568')}${adaptive(360,640,'Android corto 360×640')}${adaptive(390,844,'iPhone 390×844')}${adaptive(412,915,'Android alto 412×915')}${adaptive(600,800,'tablet verticale (ridotto)')}${adaptive(760,430,'orizzontale / PC (ridotto)')}</div>`};
/* ---------- B. intermezzi tra le fasi ---------- */
const beat=(h,p,screen)=>`<div class="beat"><div class="ph">${screen}</div><h3>${h}</h3><p>${p}</p></div>`;
const phraseBar=(t)=>`<div class="h" style="top:94px"><small>Oggi sale sulla torre…</small>${t}</div>`;
S.flusso={t:'2 · Intermezzi tra le fasi',n:'Il gioco oggi passa da una fase all’altra senza pause, e questo lo rende confuso. Proposta: ogni fase apre con una “carta titolo” a tutto schermo di 1,5–2 secondi (un tocco la salta), poi lo spazio d’azione. Le rivelazioni importanti (la Torre, i voti) avvengono un elemento alla volta. In modalità tavolo la Folla ha un piccolo timer circolare che dà il ritmo; in remota il timer è l’host a deciderlo. Ecco la storia di un turno in 8 battute.',
 beats:[
 beat('1. Chi è il Megafono','Carta titolo a inizio turno: tutti capiscono chi parla. Il Megafono vede “tocca a te”, gli altri “ascolta Marta”. Sparisce da sola dopo 2 s o con un tocco.',`<div class="s">${skyBg}<div class="title-card"><div class="sub">Turno 3 di 10</div><div class="big">Tocca a<br>Marta!</div><div style="font-size:70px;transform:rotate(-12deg);filter:drop-shadow(4px 5px 0 #13224a)">📣</div><div class="sub">Il Megafono urla, la Folla ascolta</div></div>${FR}</div>`),
 beat('2. La frase','La frase compare grande, con la scritta fissa “Oggi sale sulla torre…”. Sotto, un unico invito chiaro: “Scegliete la carta che ci sta meglio”. Il timer circolare dà il ritmo.',`<div class="s">${skyBg}${chips(1)}<div class="strip">★ ASCOLTATE! ★</div><div class="pp" style="left:18px;right:18px;top:130px;z-index:20;transform:rotate(-1deg);text-align:center"><div style="font:400 20px 'Caveat Brush'">Marta urla:</div><div style="font:400 20px 'Caveat Brush';margin-top:4px">Oggi sale sulla torre…</div><div style="font:400 36px/1.02 Anton;text-transform:uppercase;color:var(--red);text-shadow:2px 2px 0 var(--navy);margin-top:4px">chi manda vocali da nove minuti</div></div><div style="left:0;right:0;top:420px;display:flex;flex-direction:column;align-items:center;gap:14px;z-index:20"><div class="ring"><b>20</b></div><div class="sub">Scegliete la carta che ci sta meglio</div></div><div class="bt" style="left:16px;right:16px;bottom:24px;z-index:30">Vedo le mie carte</div>${FR}</div>`),
 beat('3. Le carte salgono','Quando tutti hanno giocato, una pausa a effetto: le carte coperte volano sulla Torre. Nessuno vede ancora chi ha giocato cosa.',`<div class="s">${skyBg}${chips(1)}<div class="strip">★ LE CARTE SALGONO ★</div>${towerBlock(I8.slice(0,5).map(()=>'p05-i01'),52,330,1.0,5,{dim:[0,1,2,3,4]}).replace(/<img class="cut stk"[^>]*>/g,'')}<div style="left:0;right:0;top:150px;text-align:center;z-index:20" class="big">5 su 5!</div><div class="sub" style="left:0;right:0;top:250px;text-align:center;z-index:20">tutti hanno giocato</div>${[0,1,2,3,4].map(i=>`<div style="left:${60+i*58}px;top:${300+(i%2)*26}px;width:46px;height:68px;background:linear-gradient(135deg,#14a3a1 50%,#0e7d7c 50%);border:4px solid #fff;box-shadow:3px 4px 0 #13224a;transform:rotate(${(i-2)*9}deg);z-index:12;display:grid;place-items:center;font:400 28px Anton;color:#fff">?</div>`).join('')}${FR}</div>`),
 beat('4. La Torre si svela','I personaggi appaiono uno alla volta, dal numero 1 in poi, con un “pop”. Così si guarda ogni faccia prima di discutere. Il tocco “Avanti” è del Megafono (o parte da solo dopo 4 s).',`<div class="s">${skyBg}${chips(1)}<div class="strip">★ LA TORRE È PRONTA ★</div><div class="sub" style="left:0;right:0;top:100px;text-align:center;z-index:20">…e il quarto è già salito!</div>${towerBlock(I8,52,330,1.0,5).replace(/(<img class="cut stk" src="[^"]*" style="[^"]*)(z-index:5;)/g,'$1$2')}<div class="bt" style="left:16px;right:16px;bottom:24px;z-index:30">Avanti: il Lui!</div>${FR}</div>`),
 beat('5. Il Lui! (solo Megafono)','Due gettoni tondi come nel regolamento: scegli quale usare e trascinalo (o tocca) sul personaggio. Gli altri vedono solo un gettone coperto.',`<div class="s">${skyBg}${chips(0)}<div class="strip">★ SCEGLI IL SOSPETTO ★</div><div style="left:0;right:0;top:92px;display:flex;justify-content:center;gap:26px;z-index:25">${lui('CADE',104)}${lui('NON',104)}</div><div class="sub" style="left:0;right:0;top:206px;text-align:center;z-index:25">tocca il gettone, poi il personaggio</div>${towerBlock(I8,52,420,1.0,5)}<div style="position:absolute;left:172px;top:326px;z-index:12">${lui('CADE',58)}</div><div class="bt" style="left:16px;right:16px;bottom:24px;z-index:30">Posa il Lui! sul n. 3</div>${FR}</div>`),
 beat('6. Si vota','Titolo “Votate!” poi tocca per ingrandire. Con la scritta in alto resta sempre la frase, così non ci si perde.',`<div class="s">${skyBg}${chips(1)}<div class="strip">★ VOTA IN SEGRETO ★</div><div class="h" style="top:104px;font-size:34px"><small>Oggi sale sulla torre…</small>chi manda vocali da nove minuti</div>${towerBlock(I8,52,420,1.0,5)}<div style="position:absolute;left:172px;top:334px;z-index:12">${lui('x',40,true)}</div><div class="bottom"><div class="hint-bottom">tocca un personaggio per vederlo bene</div><div class="bt">Scegli chi cade</div></div>${FR}</div>`),
 beat('7. Lo spoglio','I voti si rivelano uno alla volta, nell’ordine del regolamento (da chi è dopo il Megafono). Ogni segnalino cade sul personaggio con un suono. Sotto, il conteggio cresce. Poi il Lui! si gira.',`<div class="s">${skyBg}${chips(1)}<div class="strip">★ LO SPOGLIO ★</div><div class="sub" style="left:0;right:0;top:100px;text-align:center;z-index:20">Voto di Luca…</div>${towerBlock(I8,52,330,1.0,5)}${[[1,'#e5384b'],[1,'#2f7be0'],[2,'#f4c20d'],[2,'#3aa655']].map(([p,c],i)=>`<i class="tk2" style="position:absolute;left:${[72,106,146,176][i]}px;top:${[250,262,236,262][i]}px;width:26px;height:26px;border-radius:50%;background:${c};border:3px solid #fff;box-shadow:2px 2px 0 #13224a;z-index:14;display:grid;place-items:center;font:400 13px Anton;color:#fff">${p}</i>`).join('')}<div style="left:16px;right:16px;bottom:24px;z-index:30;display:flex;flex-direction:column;gap:6px">${[['n. 1',2],['n. 2',2],['n. 3',0]].map(([l,v])=>`<div style="display:flex;gap:8px;align-items:center;font:400 16px Anton"><span style="width:44px">${l}</span><div class="bar"><i style="width:${v*35}%"></i></div><span>${v}</span></div>`).join('')}</div>${FR}</div>`),
 beat('8. Caduta, punti e classifica','Dopo la caduta (già approvata) compare la classifica del turno con le frecce di salita/discesa; a fine round il pannello diventa “Fine del round” (vedi sezione 3).',`<div class="s">${skyBg}<div class="chips"><span class="chip">Turno 3/10</span></div><div class="h" style="top:62px;font-size:40px;text-align:center;left:0;right:0"><small>Il n. 2 è giù!</small>Punti del turno</div><div style="left:16px;right:16px;top:190px;display:flex;flex-direction:column;gap:7px;z-index:20">${[[0,'+6','segnalino Lui!'],[3,'+2','carta giocata'],[1,'+2','voto giusto'],[2,'0','—'],[4,'0','—']].map(([i,p,w])=>`<div class="pl">${dc(PLN[i][1],'l')}${PLN[i][0]}<small style="font:800 11px Nunito;opacity:.7">${w}</small><span class="tg" style="margin-left:auto">${p}</span></div>`).join('')}</div><div class="bt" style="left:16px;right:16px;bottom:24px;z-index:30">Prossimo turno</div>${FR}</div>`)
 ]};
/* ---------- C. classifica a fine round ---------- */
const rank=[[0,12,'↑ 1'],[3,10,'↓ 1'],[1,8,'='],[2,6,'↑ 1'],[4,3,'↓ 1']];
S.classifica={t:'3 · Classifica a fine round',n:'Un “round” è il giro in cui tutti hanno fatto il Megafono una volta: a 3–5 giocatori sono 2 round, a 6–8 uno solo. Alla fine di ogni round compare la classifica con barre, frecce di movimento e il passaggio del Megafono. Nel turno “normale” resta un elenco compatto dei punti. Domanda aperta: la vuoi anche dopo ogni singolo turno (versione compatta sotto i punti)?',
 phones:[`<div class="s">${skyBg}${spk(30,330)}${spk(320,300,'#ffc72c')}<div class="chips"><span class="chip">Fine del round 1 di 2</span></div><div class="h" style="top:62px;font-size:46px;text-align:center;left:0;right:0"><small>Tutti hanno fatto il Megafono</small>Classifica</div><div style="left:16px;right:16px;top:200px;display:flex;flex-direction:column;gap:8px;z-index:20">${rank.map(([i,p,d],k)=>`<div class="pl" style="${k==0?'background:#fff7d6;outline:3px solid var(--mus)':''}"><b style="font:400 20px Anton;width:22px">${k+1}</b>${dc(PLN[i][1],'l')}${PLN[i][0]}<div class="bar" style="margin-left:4px"><i style="width:${p/12*100}%;background:${k==0?'var(--red)':'var(--teal)'}"></i></div><b style="font:400 20px Anton;width:26px;text-align:right">${p}</b><span class="delta ${d[0]=='↑'?'up':d[0]=='↓'?'dn':''}">${d}</span></div>`).join('')}</div><div class="note2" style="left:16px;right:16px;top:560px;z-index:20">Il Megafono passa a <b>Luca</b>. Il round 2 inizia tra pochi secondi.</div><div class="steps" style="left:0;right:0;top:640px;z-index:20"><i class="dn"></i><i class="on"></i></div><div class="bt" style="left:16px;right:16px;bottom:24px;z-index:30">Si riparte!</div>${FR}</div>`,
 `<div class="s">${skyBg}<div class="chips"><span class="chip">Turno 3/10</span></div><div class="h" style="top:56px;font-size:36px"><small>Il n. 2 è giù!</small>Punti del turno</div><div style="left:16px;right:16px;top:176px;display:flex;flex-direction:column;gap:6px;z-index:20">${[[0,'+6',12],[3,'+2',10],[1,'+2',8],[2,'0',6],[4,'0',3]].map(([i,p,t])=>`<div class="pl" style="padding:3px 10px;min-height:38px">${dc(PLN[i][1])}${PLN[i][0]}<span style="margin-left:auto;font:400 18px Anton;color:var(--red)">${p}</span><span class="tg">${t} pt</span></div>`).join('')}</div><div class="note2" style="left:16px;right:16px;top:430px;z-index:20">Versione compatta dopo ogni turno: i punti del turno e il totale. La classifica con le barre arriva solo a fine round.</div><div class="bt" style="left:16px;right:16px;bottom:24px;z-index:30">Prossimo turno</div>${FR}</div>`]};
/* ---------- D. gettone Lui! ---------- */
S.lui={t:'4 · Il gettone “Lui!”',n:'Ripreso dal regolamento: un gettone TONDO giallo con bordo scuro. “CADE LUI!” vale 4 nel cerchietto bianco, “NON CADE LUI!” vale 1. Il Megafono li ha entrambi, ne sceglie UNO e lo appoggia coperto su un personaggio; per gli altri è un gettone scuro con “?”. Nella rivelazione si gira (animazione di rotazione) e si vede il valore. Niente più scritta rettangolare.',
 phones:[`<div class="s">${skyBg}${chips(0)}<div class="strip">★ SCEGLI IL SOSPETTO ★</div><div class="h" style="top:92px;font-size:34px"><small>Hai due gettoni “Lui!”</small>Quale usi?</div><div style="left:0;right:0;top:230px;display:flex;justify-content:center;gap:22px;z-index:25"><div style="text-align:center">${lui('CADE',128)}<div class="sub" style="font-size:20px">scommetti: cade! +4</div></div><div style="text-align:center;opacity:.9">${lui('NON',128)}<div class="sub" style="font-size:20px">scommetti: resta su +1</div></div></div><div class="note2" style="left:16px;right:16px;top:470px;z-index:20">Solo tu vedi il fronte. Gli altri vedranno un gettone coperto sul personaggio che scegli.</div><div class="bt" style="left:16px;right:16px;bottom:24px;z-index:30">Scegli il gettone</div>${FR}</div>`,
 `<div class="s">${skyBg}${chips(0)}<div class="strip">★ POSA IL GETTONE ★</div><div class="sub" style="left:0;right:0;top:92px;text-align:center;z-index:25">tocca il personaggio dove vuoi posarlo</div>${towerBlock(I8,52,330,1.0,5)}<div style="position:absolute;left:158px;top:196px;z-index:12;transform:rotate(-10deg)">${lui('CADE',70)}</div><div style="left:18px;top:620px;z-index:25;display:flex;gap:12px;align-items:center">${lui('CADE',70)}<span class="note2">gettone scelto: CADE LUI! (+4)</span></div><div class="bt" style="left:16px;right:16px;bottom:24px;z-index:30">Posa il Lui! sul n. 3</div>${FR}</div>`,
 `<div class="s">${skyBg}${chips(1)}<div class="strip">★ LO SPOGLIO ★</div><div class="sub" style="left:0;right:0;top:92px;text-align:center;z-index:25">Il Lui! di Marta sta per girarsi…</div>${towerBlock(I8,52,330,1.0,5)}<div style="position:absolute;left:158px;top:196px;z-index:12;transform:rotate(-10deg)">${lui('x',70,true)}</div><div style="position:absolute;left:236px;top:150px;z-index:30;transform:rotate(-8deg) scale(1.5)">${lui('CADE',70)}</div><div class="note2" style="left:16px;right:16px;bottom:96px;z-index:30">Marta aveva scommesso: CADE LUI! sul n. 3 → <b>+4</b> perché è davvero caduto.</div><div class="bt" style="left:16px;right:16px;bottom:24px;z-index:30">Avanti</div>${FR}</div>`]};
/* ---------- E. frase del Megafono ---------- */
S.frase={t:'5 · Frase personale del Megafono',n:'Oggi l’opzione “Ne invento una io” non dice cosa succede dopo (si parla a voce, ma gli altri non vedono nulla). Proposta in due passi chiari: (1) scegli “Dalla carta” oppure “La mia frase”; (2) per la tua frase scrivi soltanto il finale: “Oggi sale sulla torre…” è già fisso. La frase appare a tutti sul loro schermo; in modalità tavolo puoi anche spuntare “la dico solo a voce”. Il testo è limitato e controllato dal server.',
 phones:[`<div class="s">${skyBg}${chips(0)}<div class="strip">★ SEI IL MEGAFONO ★</div><div class="h" style="top:92px;font-size:38px"><small>Cosa urli alla folla?</small>Scegli come</div><div style="left:16px;right:16px;top:240px;display:flex;flex-direction:column;gap:14px;z-index:20"><div class="big-opt on"><span class="ic">🃏</span><div><b>Dalla carta</b><small>5 frasi pronte: ne scegli una</small></div></div><div class="big-opt"><span class="ic">✍️</span><div><b>La mia frase</b><small>La scrivi tu: “Oggi sale sulla torre…” c’è già</small></div></div></div><div class="note2" style="left:16px;right:16px;top:470px;z-index:20">Con la carta a frase singola la scelta non c’è: va letta com’è.</div><div class="bt red" style="left:16px;right:16px;bottom:24px;z-index:30">Avanti</div>${FR}</div>`,
 `<div class="s">${skyBg}${chips(0)}<div class="strip">★ LA MIA FRASE ★</div><div style="left:16px;right:16px;top:100px;z-index:20"><span class="pre">Oggi sale sulla torre…</span><div class="ta" style="margin-top:10px">chi risponde ai vocali con un vocale più lungo<span class="caret"></span></div><div style="display:flex;justify-content:space-between;margin-top:6px;font:800 12px Nunito"><span>Finisci la frase: chi, quelli che…</span><span>47 / 80</span></div></div><div style="left:16px;right:16px;top:330px;z-index:20"><div class="lb" style="color:#fff;text-shadow:1px 1px 0 var(--navy)">Idee veloci</div><div style="display:flex;flex-wrap:wrap;gap:6px">${['chi arriva sempre in ritardo','chi risponde “ok” a tutto','chi si offende per tutto','chi dice “passavo di qui”'].map(t=>`<span class="chip" style="font-size:12px">${t}</span>`).join('')}</div></div><label style="left:16px;right:16px;top:470px;z-index:20;display:flex;gap:10px;align-items:center;font:800 14px Nunito;background:#fff7e0;border:2px solid var(--navy);padding:8px"><span class="sw" style="transform:scale(.8)"></span>La dico solo a voce (non la mostro)</label><div class="bottom two"><div class="bt pap" style="flex:.6;font-size:17px">‹ Indietro</div><div class="bt red">📣 Proclama!</div></div>${FR}</div>`,
 `<div class="s">${skyBg}${chips(1)}<div class="strip">★ ASCOLTATE! ★</div><div class="pp" style="left:18px;right:18px;top:130px;z-index:20;transform:rotate(-1deg);text-align:center"><div style="font:400 20px 'Caveat Brush'">Marta ha inventato:</div><div style="font:400 20px 'Caveat Brush';margin-top:4px">Oggi sale sulla torre…</div><div style="font:400 32px/1.04 Anton;text-transform:uppercase;color:var(--red);text-shadow:2px 2px 0 var(--navy);margin-top:4px">chi risponde ai vocali con un vocale più lungo</div></div><div style="left:0;right:0;top:420px;display:flex;flex-direction:column;align-items:center;gap:14px;z-index:20"><div class="ring"><b>20</b></div><div class="sub">Scegliete la carta che ci sta meglio</div></div><div class="note2" style="left:16px;right:16px;bottom:96px;z-index:30">Cosa vedono gli altri: la frase scritta, con il nome di chi l’ha inventata.</div><div class="bt" style="left:16px;right:16px;bottom:24px;z-index:30">Vedo le mie carte</div>${FR}</div>`]};
const order=['adatt','flusso','classifica','lui','frase'];
const nav=document.getElementById('nav'),main=document.getElementById('main');
function render(id){main.innerHTML='';(id==='all'?order:[id]).forEach(k=>{const s=S[k],e=document.createElement('section');e.className='sec';
 const body=s.raw?s.raw:s.beats?`<div class="row">${s.beats.join('')}</div>`:`<div class="row">${(s.phones||[]).map(h=>`<div class="phw"><div class="ph">${h}</div></div>`).join('')}</div>`;
 e.innerHTML=`<h2>${s.t}</h2><p class="note">${s.n}</p>${body}`;main.appendChild(e)});[...nav.children].forEach(b=>b.classList.toggle('on',b.dataset.id===id));fit()}
function fit(){const k=Math.min(1,(innerWidth-32)/390);document.querySelectorAll('.phw:not(.sm) , .beat').forEach(p=>{const ph=p.querySelector('.ph');if(ph){ph.style.zoom=k;p.style.width=390*k+'px'}})}
addEventListener('resize',fit);
[['all','Tutte']].concat(order.map(k=>[k,S[k].t])).forEach(([k,t])=>{const b=document.createElement('button');b.textContent=t;b.dataset.id=k;b.onclick=()=>render(k);nav.appendChild(b)});
render('all');
</script></body></html>
