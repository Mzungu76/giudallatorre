name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run e2e   # Worker reale in locale: HTTP + WebSocket + Durable Object SQLite
      - name: Browser per la prova dell'interfaccia
        run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: npm run e2e:ui   # 3 browser giocano una partita intera + schermo condiviso

  deploy:
    # Pubblica solo da main, dopo i test, e solo se i segreti Cloudflare sono stati configurati (vedi docs/DEPLOYMENT.md).
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Controllo segreti
        id: sec
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; echo "Segreti Cloudflare assenti: deploy saltato."; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: Build frontend
        if: steps.sec.outputs.ok == 'true'
        run: npm run build
      - name: Deploy
        if: steps.sec.outputs.ok == 'true'
        run: npx wrangler deploy
